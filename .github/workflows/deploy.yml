name: Fixed Deploy to Amazon Linux EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy and Transfer
        env:
          # Your sensitive private key text pulled from GitHub Secrets
          SSH_KEY: ${{ secrets.EC2_KEY }}
          # Hardcoded server parameters to guarantee variables do not collapse to empty strings
          SSH_USER: "ec2-user"
          SSH_HOST: "13.206.247.13"
        run: |
          # 1. Recreate the private key file locally on the runner
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # 2. Crash immediately if the EC2_KEY secret failed to load from settings
          if [ -z "$SSH_KEY" ]; then
            echo "CRITICAL ERROR: GitHub is still blocking access to your EC2_KEY secret!"
            exit 1
          fi
          
          # 3. Copy index.html directly to the ec2-user home directory using explicit variables
          scp -o StrictHostKeyChecking=no -i private_key.pem index.html ${SSH_USER}@${SSH_HOST}:/home/ec2-user/index.html
          
          # 4. SSH into the server to safely move the file into the public web server folder
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SSH_USER}@${SSH_HOST} "sudo mv /home/ec2-user/index.html /var/www/html/index.html"
