name: Deploy to EC2

on:
  push:
    # This ensures it triggers no matter what your branch is named
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to run it manually with a button click

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # We add an explicit check to stop early if GitHub cannot read the secrets
      - name: Verify Secret Availability
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: GitHub cannot read your EC2_HOST secret!"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "ERROR: GitHub cannot read your EC2_USER secret!"
            exit 1
          fi

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "hostname"

      - name: Deploy Application
        run: |
          scp -o StrictHostKeyChecking=no \
          -i private_key.pem \
          index.html \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/index.html

          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo mv /tmp/index.html /var/www/html/index.html"
