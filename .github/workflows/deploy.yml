name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Secret Lengths
        run: |
          echo "USER_LENGTH=$(echo '${{ secrets.EC2_USER }}' | wc -c)"
          echo "HOST_LENGTH=$(echo '${{ secrets.EC2_HOST }}' | wc -c)"

      - name: Show Target
        run: |
          echo "TARGET=${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"

      - name: Setup SSH Key
        run: |
          cat > private_key.pem << 'EOF'
${{ secrets.EC2_KEY }}
EOF
          chmod 600 private_key.pem

      - name: Verify Key File
        run: |
          ls -l private_key.pem
          head -1 private_key.pem
          tail -1 private_key.pem

      - name: Show SCP Command
        run: |
          echo "scp -i private_key.pem index.html ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/index.html"

      - name: Test SSH Connectivity
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "hostname"

      - name: Deploy Application
        run: |
          scp -o StrictHostKeyChecking=no \
          -i private_key.pem \
          index.html \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/index.html

          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo mv /tmp/index.html /var/www/html/index.html && sudo systemctl restart httpd"
