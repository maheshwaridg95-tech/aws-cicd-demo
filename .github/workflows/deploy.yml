name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy and Transfer
        env:
          # This forces GitHub to bind secrets directly to local variables safely
          SSH_KEY: ${{ secrets.EC2_KEY }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # 1. Write the key to a file safely
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # 2. Check if variables are empty right here
          if [ -z "$SSH_USER" ] || [ -z "$SSH_HOST" ]; then
            echo "CRITICAL ERROR: Repository secrets are empty or inaccessible."
            exit 1
          fi
          
          # 3. Execute SCP and SSH using the localized variables
          scp -o StrictHostKeyChecking=no -i private_key.pem index.html ${SSH_USER}@${SSH_HOST}:/tmp/index.html
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SSH_USER}@${SSH_HOST} "sudo mv /tmp/index.html /var/www/html/index.html"
