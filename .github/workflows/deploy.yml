name: Deploy to Amazon Linux EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy and Transfer
        env:
          SSH_KEY: ${{ secrets.EC2_KEY }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # 1. Recreate the private key file locally on the runner
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # 2. Hard stop if your secrets are failing to load from GitHub Settings
          if [ -z "$SSH_USER" ] || [ -z "$SSH_HOST" ]; then
            echo "CRITICAL ERROR: GitHub Repository Secrets are empty or hidden!"
            exit 1
          fi
          
          # 3. Copy the file directly to your ec2-user home directory
          scp -o StrictHostKeyChecking=no -i private_key.pem index.html ${SSH_USER}@${SSH_HOST}:/home/ec2-user/index.html
          
          # 4. SSH into the server to move the file into the web server directory
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SSH_USER}@${SSH_HOST} "sudo mv /home/ec2-user/index.html /var/www/html/index.html"
