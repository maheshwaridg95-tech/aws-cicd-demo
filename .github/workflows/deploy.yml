name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Values
        run: |
          echo "User exists"
          echo "${{ secrets.EC2_USER }}" | wc -c
          echo "Host exists"
          echo "${{ secrets.EC2_HOST }}" | wc -c

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Show Target
        run: |
          echo "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"

      - name: Test SSH
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "hostname"

      - name: Deploy
        run: |
          scp -o StrictHostKeyChecking=no \
          -i private_key.pem \
          index.html \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/index.html

          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo mv /tmp/index.html /var/www/html/index.html"
